[package]
name = "core_server"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
# ============================================================================
pq-sys = { version = "0.6", features = ["bundled"] }
openssl-sys = { version = "0.9.100", features = ["vendored"] }
# ============================================================================
diesel = { version = "2.2.0", features = ["postgres", "serde_json", "chrono", "without-deprecated", "r2d2"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
# ============================================================================
dotenvy = "0.15.7"
# ============================================================================
serde = { version = "1.0.219", features=["derive"] }
serde_json = "1.0.142"
# ============================================================================
chrono = { version = "0.4.41", features = ["serde"] }
# ============================================================================
r2d2 = "0.8.10"
postgis = "0.9.0"
rayon = "1.10.0"
geojson = "0.24.2"
postgis_diesel = "3.0.1"
thiserror = "2.0.14"
# ============================================================================
